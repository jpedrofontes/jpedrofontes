services:
  jpedrofontes:
    image: ${JPEDROFONTES_IMAGE:?Set the tested release image}
    container_name: jpedrofontes
    ports:
      - "127.0.0.1:10006:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s